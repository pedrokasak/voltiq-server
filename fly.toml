# fly.toml app configuration file generated for voltiq-sw-server on 2026-07-24T16:58:47-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'voltiq-sw-server'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # 1 maquina sempre ligada: os jobs agendados (trial, cobranca, balanco
  # diario, reenvio de alertas) rodam dentro do processo da API.
  min_machines_running = 1
  processes = ['app']

[env]
  APP_ENV = 'production'
  SCHEDULER_ENABLED = 'true'

[[http_service.checks]]
  grace_period = '10s'
  interval = '30s'
  method = 'GET'
  path = '/health'
  timeout = '5s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
