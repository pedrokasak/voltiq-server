version: '3.9'

services:
  # PostgreSQL + TimescaleDB (single image)
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: voltiqsw-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voltiq-sw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - voltiq-sw-net

  # API Go
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voltiq-sw-api
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - voltiq-sw-net

  # Migrations (one-off)
  migrate:
    image: migrate/migrate:latest
    volumes:
      - ./migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://postgres:postgres@db:5432/voltiq-sw?sslmode=disable", "up"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - voltiq-sw-net

volumes:
  pgdata:

networks:
  voltiq-sw-net:
    driver: bridge
